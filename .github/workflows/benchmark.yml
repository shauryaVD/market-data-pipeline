name: Benchmark

on:
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: postgresql://market_user:market_password@localhost:5432/market_data
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Start PostgreSQL
        run: |
          docker compose up -d
          until [ "$(docker inspect -f '{{.State.Health.Status}}' market-data-postgres)" = healthy ]; do
            docker compose ps
            sleep 2
          done

      - name: Apply schema
        run: market-data-pipeline init-db --config configs/pipeline.yml

      - name: Run benchmark
        run: python scripts/run_benchmark.py --reset-db

      - name: Upload benchmark output
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            docs/BENCHMARK.md
            docs/benchmark-results.json
