[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "market-data-pipeline"
version = "0.1.0"
description = "Batch ETL pipeline for ingesting market price CSVs into PostgreSQL."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Shaurya Dahiya" }]
dependencies = [
  "pandas>=2.2",
  "psycopg2-binary>=2.9",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
market-data-pipeline = "market_data_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
